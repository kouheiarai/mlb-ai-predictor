<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB AI Predictor Ver.25.1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:1200px;margin:auto;padding:20px;background:#f4f6fa;color:#172033}header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:18px}section{background:#fff;border:1px solid #e3e7ef;border-radius:14px;padding:15px;box-shadow:0 4px 16px #1018280c}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #edf0f5;text-align:left}.muted{color:#667085}.pill{display:inline-block;border-radius:999px;padding:2px 7px;background:#e8f7ee;color:#067647;font-weight:700}.err{color:#b42318}</style></head><body><header><div><h1>MLB AI Predictor Ver.25.1</h1><div id="meta" class="muted">読み込み中…</div></div><a href="prediction_latest.json">JSON</a></header><div class="grid"><section><h2>ML TOP</h2><div id="ml"></div></section><section><h2>RL TOP</h2><div id="rl"></div></section><section><h2>O/U TOP</h2><div id="total"></div></section></div><script>const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';const odds=v=>v==null?'—':Number(v).toFixed(2);function render(rows){if(!rows?.length)return'<p class="muted">BUYなし</p>';return'<table><thead><tr><th>Pick</th><th>Odds</th><th>AI</th><th>EV</th><th>Kelly</th></tr></thead><tbody>'+rows.slice(0,10).map(r=>`<tr><td><b>${r.selection}${r.point!==''&&r.point!=null?' '+(Number(r.point)>0?'+':'')+r.point:''}</b> <span class="pill">${r.confidence||''}</span><br><small class="muted">${r.away_team} @ ${r.home_team}</small></td><td>${odds(r.decimal_odds)}</td><td>${pct(r.model_probability)}</td><td>${pct(r.ev)}</td><td>${pct(r.quarter_kelly)}</td></tr>`).join('')+'</tbody></table>'}fetch('./prediction_latest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('meta').textContent=`更新 ${d.updated_at_utc} / Model ${d.model_version} / ${d.game_count||0}試合`;document.getElementById('ml').innerHTML=render(d.buy_rankings?.moneyline);document.getElementById('rl').innerHTML=render(d.buy_rankings?.runline);document.getElementById('total').innerHTML=render(d.buy_rankings?.total)}).catch(e=>document.body.insertAdjacentHTML('beforeend',`<p class="err">取得失敗: ${e.message}</p>`));</script></body></html>
