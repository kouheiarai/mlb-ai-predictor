name: MLB AI Predictor Auto Update

on:
  workflow_dispatch:
  schedule:
    # The Odds API の無料枠は月 500 クレジットで、1 回の実行で 3 消費する。
    # 毎時実行だと月 2160 になり 8 日ほどで枠が尽きるため、1 日 4 回に絞る
    # （月 372）。MLB の試合は UTC 17 時〜翌 1 時に集中するので、その直前を
    # 狙って賭ける前に最新のオッズが載るようにしている。
    - cron: "0 16,20,22 * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: mlb-ai-predictor-update
  cancel-in-progress: true

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run run-model regression tests
        run: python -m unittest test_run_model

      - name: Generate predictions
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python main.py

      - name: Publish public endpoints
        run: python publish.py

      - name: Validate public outputs
        run: |
          python validate_outputs.py
          cat data/output_manifest.json

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update MLB predictions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
