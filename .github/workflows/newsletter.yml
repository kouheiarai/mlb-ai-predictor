name: Japan Money Weekly

on:
  workflow_dispatch:
    inputs:
      issue_type:
        description: "号種を明示する（空なら config.yaml の判定に従う）"
        required: false
        type: choice
        options: ["", "weekly", "boj", "shunto"]
        default: ""
  schedule:
    # 毎週水曜 08:00 JST = 火曜 23:00 UTC。
    # 火曜の米国市場が引けたあとで、日本の水曜午前に届く時間帯を狙っている。
    - cron: "0 23 * * 2"

permissions:
  contents: write
  # 原稿ができたことを知らせる Issue を立てるために必要
  issues: write

concurrency:
  group: japan-money-weekly
  cancel-in-progress: false

jobs:
  write-issue:
    runs-on: ubuntu-latest
    # リサーチに Web 検索を十数回まわすので 1 号あたり数分〜十数分かかる
    timeout-minutes: 30

    # ランナーは UTC なので、そのままだと水曜 08:00 JST の実行が「火曜」の日付になり、
    # 生成物のファイル名も履歴も 1 日ずれる。日本時間に固定して揃える。
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsletter/requirements.txt

      - name: Install dependencies
        run: pip install -r newsletter/requirements.txt

      # ANTHROPIC_API_KEY があれば記事本体まで書かせる。無ければ claude.ai に貼るための
      # プロンプトを書き出す。無料運用のままでも、毎週の準備だけは自動で終わっている状態にする。
      - name: Generate issue (or the prompt to paste into claude.ai)
        id: generate
        working-directory: newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # publish.mode が local のあいだは未設定でよい
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          ISSUE_TYPE: ${{ inputs.issue_type }}
        run: |
          ARGS=""
          if [ -n "$ISSUE_TYPE" ]; then
            ARGS="--type $ISSUE_TYPE"
          fi
          TODAY="$(date +%Y-%m-%d)"
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"

          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::API モード — 記事本体まで生成します"
            python generate.py $ARGS
            echo "mode=api" >> "$GITHUB_OUTPUT"
            echo "path=newsletter/state/issues" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::無料モード — claude.ai に貼るプロンプトを生成します"
            mkdir -p state/prompts
            OUT="state/prompts/${TODAY}-prompt.txt"
            python generate.py --print-prompt $ARGS > "$OUT"
            echo "書き出しました: $OUT"
            echo "mode=free" >> "$GITHUB_OUTPUT"
            echo "path=newsletter/$OUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the result
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/state
          if git diff --staged --quiet; then
            echo "No new issue to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Add newsletter material for $(date +%Y-%m-%d)"
          # 手動実行と定時実行がかち合ったときのために、push 前に取り込む
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 原稿ができたことを Issue で知らせる。作成者を assignee にすると GitHub が
      # 本人へ通知メールを送るので、SMTP の設定も外部サービスも要らない。
      - name: Notify that this week's material is ready
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.generate.outputs.date }}
          MODE: ${{ steps.generate.outputs.mode }}
          FILE: ${{ steps.generate.outputs.path }}
          BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}
        run: |
          # 本文はファイルに組み立てて --body-file で渡す。長い文章をシェルの
          # 引用符に通さずに済むので、バッククォートも括弧もそのまま書ける。
          #
          # ヒアドキュメントの中身はこのブロックと同じ字下げにしてある。YAML が
          # ブロック全体の字下げを取り除いてからシェルに渡すので、行頭の空白は
          # 本文には残らない。ここだけ左端に寄せると YAML が壊れる。
          if [ "$MODE" = "free" ]; then
            HEADLINE="今週の原稿の材料ができました"
          else
            HEADLINE="今週の記事ができました"
          fi

          {
            echo "## $HEADLINE"
            echo
            echo "**[開く]($BASE/$FILE)**"

            if [ "$MODE" = "free" ]; then
              cat <<'EOF'

          ### やること（10分）

          1. 上のリンクを開いて、中身を全部コピー（`Ctrl`+`A` → `Ctrl`+`C`）
          2. [claude.ai](https://claude.ai) に貼る — **リサーチ機能を必ずオンに**
          3. 返ってきた記事をコピー
          4. [beehiiv](https://app.beehiiv.com) で新規 Post → 本文で `/` → **HTML snippet** → 貼る
          5. 件名は候補が10個出るので、40文字以内で切れないものを選ぶ
          EOF
            else
              cat <<'EOF'

          `.md` の先頭にある日本語のレビューサマリーを読んでから公開してください。
          とくに「確信度が低い箇所」は必ず確認を。
          EOF
            fi

            echo
            echo "終わったらこの Issue を Close してください。"
          } > body.md

          # 原稿そのものは push 済みなので、通知に失敗しても週次の成果は失われない。
          # ジョブ全体を赤くせず、警告だけ残す。
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "今週の原稿ができました（$DATE）" \
            --body-file body.md \
            --assignee "${{ github.repository_owner }}" \
          || echo "::warning::Issue を作れませんでした。リポジトリの Issues が無効かもしれません。原稿は $FILE に入っています。"

          rm -f body.md
