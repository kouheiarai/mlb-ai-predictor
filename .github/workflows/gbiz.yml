name: gBizINFO Change Signal

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "何日分さかのぼって取得するか"
        required: false
        default: "7"
  schedule:
    # gBizINFO の元データは府省ごとの取込頻度に従うため、日次より細かく引いても
    # 新しい情報は増えない。JST 9:00 の 1 日 1 回に固定する。
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: gbiz-change-signal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for API token
        id: token
        env:
          GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
        run: |
          if [ -z "$GBIZINFO_API_TOKEN" ]; then
            echo "::warning::GBIZINFO_API_TOKEN is not set. Skipping collection."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run offline tests
        run: python -m unittest gbiz.test_gbiz

      - name: Collect change signal
        if: steps.token.outputs.present == 'true'
        env:
          GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
        run: |
          python -m gbiz.main --lookback-days "${{ github.event.inputs.lookback_days || '7' }}"

      - name: Commit accumulated events
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gbiz_data
          if git diff --cached --quiet; then
            echo "No new events today."
          else
            git commit -m "Accumulate gBizINFO change signal"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
